# SPDX-License-Identifier: BSD-2-Clause
[package]
name = "magia_rs"
version = "0.2.0"
edition = "2024"
license = "BSD-2-Clause"
description = "Magia kernel: Rust policy and subsystems (no_std, zero dependencies)"
publish = false

[lib]
name = "magia_rs"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
debug = true
lto = false
codegen-units = 1
