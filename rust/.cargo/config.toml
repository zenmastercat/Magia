# Kernel build flags: the staticlib is linked into magia.elf, a static PIE
# that Limine relocates and slides (KASLR) inside the top 2 GiB, so use
# position-independent code with RIP-relative addressing, and keep frame
# pointers for panic backtraces.
[target.x86_64-unknown-none]
rustflags = ["-C", "relocation-model=pie", "-C", "code-model=small", "-C", "force-frame-pointers=yes"]
