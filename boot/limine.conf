# Limine configuration for Magia (https://codeberg.org/Limine/Limine, CONFIG.md).
# The QEMU tests do not use this file: they pass a config per run through an
# SMBIOS OEM string ("limine:config:...", see tests/qemu.sh).
timeout: 5

/Magia
    comment: Magia with the APIC timer and framebuffer console
    protocol: limine
    path: boot():/boot/magia.elf
    kaslr: yes

/Magia (print every boot step: verbose)
    protocol: limine
    path: boot():/boot/magia.elf
    kaslr: yes
    cmdline: verbose

/Magia (legacy 8259 PIC: noapic)
    protocol: limine
    path: boot():/boot/magia.elf
    kaslr: yes
    cmdline: noapic

/Magia (run the in-kernel tests: ktest)
    protocol: limine
    path: boot():/boot/magia.elf
    kaslr: yes
    cmdline: ktest
